name: Build Avex APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Android Action
      uses: kevin-david/android-build-action@v1.4.1
      with:
        build-type: apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Avex-Jarvis-APK
        path: app/build/outputs/apk/debug/*.apk
        
